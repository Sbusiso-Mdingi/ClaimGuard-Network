name: Patch Phase 11D test condition

on:
  push:
    branches:
      - agent/remove-demo-auth-and-accounts

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: agent/remove-demo-auth-and-accounts
          fetch-depth: 0

      - name: Apply exact workflow patch and remove this helper
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/ci.yml')
          content = workflow.read_text()
          old = '''          pnpm \\
            --filter @claimguard/api \\
            exec node \\
            --test tests/phase11d-mysql.integration.test.js
'''
          new = '''          pnpm \\
            --filter @claimguard/api \\
            exec node \\
            --conditions=test \\
            --test tests/phase11d-mysql.integration.test.js
'''
          if content.count(old) != 1:
              raise SystemExit('Expected exactly one Phase 11D workflow command to patch.')
          workflow.write_text(content.replace(old, new))
          PY
          rm .github/workflows/patch-phase11d-test-condition.yml

      - name: Commit exact patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/ci.yml .github/workflows/patch-phase11d-test-condition.yml
          git commit -m "ci: enable test exports for phase11d mysql gate"
          git push origin HEAD:agent/remove-demo-auth-and-accounts
