name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: Exact 40-character main commit SHA approved for production
        required: true
        type: string
      production_confirmation:
        description: Type DEPLOY_PRODUCTION to authorize the release
        required: true
        type: string
      promotion_request_id:
        description: Approved ClaimGuard promotion request UUID; leave empty only for the one-time governance bootstrap
        required: false
        type: string

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  AZURE_KEYVAULT_NAME: ${{ vars.AZURE_KEYVAULT_NAME }}
  CONTROL_PLANE_MYSQL_URL_SECRET_NAME: ${{ vars.CONTROL_PLANE_MYSQL_URL_SECRET_NAME }}
  MYSQL_URL_SECRET_NAME: ${{ vars.MYSQL_URL_SECRET_NAME }}
  AZURE_WEBAPP_WEB: ${{ vars.AZURE_WEBAPP_WEB }}
  AZURE_WEBAPP_API: ${{ vars.AZURE_WEBAPP_API }}

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: |
            **/uv.lock
            **/pyproject.toml

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Reject credential material in Git history
        run: |
          node --test tools/audit-credential-history.test.mjs
          node tools/audit-credential-history.mjs --fail-on-findings

      - name: Validate explicit production deployment authorization
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          PRODUCTION_CONFIRMATION: ${{ inputs.production_confirmation }}
          PROMOTION_REQUEST_ID: ${{ inputs.promotion_request_id }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          [[ "$EXPECTED_MAIN_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$EXPECTED_MAIN_SHA" = "$GITHUB_SHA"
          test "$PRODUCTION_CONFIRMATION" = "DEPLOY_PRODUCTION"
          if [ -n "$PROMOTION_REQUEST_ID" ]; then
            [[ "$PROMOTION_REQUEST_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$ ]]
          fi

      - name: Lint and build the complete monorepo
        run: pnpm turbo run lint build

      - name: Run JavaScript tests with coverage
        shell: bash
        run: |
          set -euo pipefail
          rm -rf coverage/javascript
          mkdir -p coverage/javascript/raw

          export NODE_V8_COVERAGE="$GITHUB_WORKSPACE/coverage/javascript/raw"
          pnpm --recursive \
            --filter './apps/**' \
            --filter './packages/**' \
            --filter '!@claimguard/web' \
            --filter '!@claimguard/desktop' \
            --filter '!@claimguard/claimguard-sdk' \
            --if-present \
            run test
          unset NODE_V8_COVERAGE

          pnpm --filter @claimguard/web run test:coverage
          pnpm --filter @claimguard/desktop run test:coverage

          pnpm dlx c8@12.0.0 report \
            --temp-directory=coverage/javascript/raw \
            --all \
            --src=apps \
            --src=packages \
            --extension=.js \
            --extension=.jsx \
            --extension=.cjs \
            --extension=.mjs \
            --exclude='**/tests/**' \
            --exclude='**/*.test.*' \
            --exclude='**/dist/**' \
            --exclude='**/node_modules/**' \
            --exclude='**/src/setupTests.js' \
            --exclude='apps/web/**' \
            --reporter=text-summary \
            --reporter=lcov \
            --reports-dir=coverage/javascript/node

          test -s coverage/javascript/node/lcov.info
          test -s coverage/javascript/web/lcov.info
          test -s coverage/javascript/desktop/lcov.info

      - name: Run all Python tests with coverage
        shell: bash
        run: |
          set -euo pipefail
          rm -rf coverage/python
          mkdir -p coverage/python

          COVERAGE_FILE="$GITHUB_WORKSPACE/coverage/python/.coverage.claimguard-sdk" \
          uv run --project packages/claimguard-sdk --frozen --with coverage==7.15.2 \
            coverage run --rcfile=coverage.ini \
            -m pytest packages/claimguard-sdk/tests

          COVERAGE_FILE="$GITHUB_WORKSPACE/coverage/python/.coverage.detection-engine" \
          uv run --project services/detection-engine --frozen --with coverage==7.15.2 \
            coverage run --rcfile=coverage.ini \
            -m unittest discover \
            -s services/detection-engine/tests \
            -p 'test_*.py'

          COVERAGE_FILE="$GITHUB_WORKSPACE/coverage/python/.coverage.report-producer" \
          uv run --project services/report-producer --frozen --with coverage==7.15.2 \
            coverage run --rcfile=coverage.ini \
            -m unittest discover \
            -s services/report-producer/tests \
            -p 'test_*.py'

          COVERAGE_FILE="$GITHUB_WORKSPACE/coverage/python/.coverage" \
          uv run --project packages/claimguard-sdk --frozen --with coverage==7.15.2 \
            coverage combine --rcfile=coverage.ini coverage/python
          COVERAGE_FILE="$GITHUB_WORKSPACE/coverage/python/.coverage" \
          uv run --project packages/claimguard-sdk --frozen --with coverage==7.15.2 \
            coverage xml --rcfile=coverage.ini \
            -o coverage/python/coverage.xml

          test -s coverage/python/coverage.xml

      - name: Upload JavaScript coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
        with:
          use_oidc: true
          files: ./coverage/javascript/node/lcov.info,./coverage/javascript/web/lcov.info,./coverage/javascript/desktop/lcov.info
          flags: javascript
          name: javascript
          disable_search: true
          fail_ci_if_error: true
          verbose: true

      - name: Upload Python coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
        with:
          use_oidc: true
          files: ./coverage/python/coverage.xml
          flags: python
          name: python
          disable_search: true
          fail_ci_if_error: true
          verbose: true

      - name: Upload web build artifact for inspection
        if: ${{ always() && hashFiles('apps/web/dist/**') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: web-dist
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 14

      - name: Package deployable web artifact
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.production_confirmation == 'DEPLOY_PRODUCTION' && inputs.expected_main_sha == github.sha
        run: |
          rm -rf /tmp/claimguard-web-deploy
          pnpm --filter ./apps/web deploy /tmp/claimguard-web-deploy -P
          rm -f /tmp/claimguard-web-deploy.zip
          cd /tmp/claimguard-web-deploy
          zip -qr /tmp/claimguard-web-deploy.zip . \
            -x ".turbo/*" \
               "tests/*" \
               "docs/*" \
               "src/setupTests.js" \
               "vitest.config.ts"

      - name: Package deployable API artifact
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.production_confirmation == 'DEPLOY_PRODUCTION' && inputs.expected_main_sha == github.sha
        run: |
          rm -rf /tmp/claimguard-api-deploy
          pnpm --filter ./apps/api deploy /tmp/claimguard-api-deploy -P
          rm -f /tmp/claimguard-api-deploy.zip
          cd /tmp/claimguard-api-deploy
          # Preserve pnpm symlinks in the zip to keep runtime module resolution intact.
          zip -qry /tmp/claimguard-api-deploy.zip . \
            -x ".turbo/*" \
               "tests/*" \
               "reports/*" \
               "*.log"

      - name: Verify API artifact preserves pnpm symlinks
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.production_confirmation == 'DEPLOY_PRODUCTION' && inputs.expected_main_sha == github.sha
        run: |
          rm -rf /tmp/claimguard-api-deploy-check
          mkdir -p /tmp/claimguard-api-deploy-check
          unzip -q /tmp/claimguard-api-deploy.zip -d /tmp/claimguard-api-deploy-check
          test -L /tmp/claimguard-api-deploy-check/node_modules/hono
          test -L /tmp/claimguard-api-deploy-check/node_modules/@claimguard/database
          node tools/create-release-manifest.mjs \
            "$GITHUB_SHA" \
            /tmp/claimguard-web-deploy.zip \
            /tmp/claimguard-api-deploy.zip \
            /tmp/release-manifest.json

      - name: Upload deployable artifacts
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.production_confirmation == 'DEPLOY_PRODUCTION' && inputs.expected_main_sha == github.sha
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: claimguard-deploy-packages
          path: |
            /tmp/claimguard-web-deploy.zip
            /tmp/claimguard-api-deploy.zip
            /tmp/release-manifest.json
          if-no-files-found: error
          retention-days: 14

  mysql-integration:
    name: Real MySQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: claimguard_ci_root
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent -h 127.0.0.1 -uroot -pclaimguard_ci_root"
          --health-interval=5s
          --health-timeout=5s
          --health-start-period=20s
          --health-retries=30

    env:
      MYSQL_ROOT_URL: "mysql://root:claimguard_ci_root@127.0.0.1:3306/mysql"

      CONTROL_PLANE_TEST_MYSQL_URL: "mysql://root:claimguard_ci_root@127.0.0.1:3306/claimguard_control_integration"

      OPERATIONAL_TEST_MYSQL_URL: "mysql://root:claimguard_ci_root@127.0.0.1:3306/claimguard_operational_integration"

      PHASE11D_CONTROL_PLANE_MYSQL_URL: "mysql://root:claimguard_ci_root@127.0.0.1:3306/claimguard_phase11d_control"

      PHASE11D_MYSQL_URL: "mysql://root:claimguard_ci_root@127.0.0.1:3306/claimguard_phase11d_operational"

      PHASE11E_CONTROL_PLANE_MYSQL_URL: "mysql://root:claimguard_ci_root@127.0.0.1:3306/claimguard_phase11e_control"

      PHASE11E_MYSQL_SERVER_ADMIN_URL: "mysql://root:claimguard_ci_root@127.0.0.1:3306/mysql"

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Create isolated integration databases
        shell: bash
        run: |
          set -euo pipefail

          pnpm --filter @claimguard/database exec \
            node --input-type=module - <<'NODE'
          import mysql from "mysql2/promise";

          const rootUrl =
            process.env.MYSQL_ROOT_URL;

          if (!rootUrl) {
            throw new Error(
              "MYSQL_ROOT_URL is required.",
            );
          }

          const databaseUrls = [
            process.env
              .CONTROL_PLANE_TEST_MYSQL_URL,

            process.env
              .OPERATIONAL_TEST_MYSQL_URL,

            process.env
              .PHASE11D_CONTROL_PLANE_MYSQL_URL,

            process.env
              .PHASE11D_MYSQL_URL,

            process.env
              .PHASE11E_CONTROL_PLANE_MYSQL_URL,
          ];

          const databaseNames =
            [
              ...new Set(
                databaseUrls.map(
                  (value) => {
                    if (!value) {
                      throw new Error(
                        "An integration database URL is missing.",
                      );
                    }

                    const name =
                      new URL(value)
                        .pathname
                        .replace(
                          /^\/+/,
                          "",
                        );

                    if (
                      !/^[a-zA-Z0-9_]+$/.test(
                        name,
                      )
                    ) {
                      throw new Error(
                        `Unsafe integration database name: ${name}`,
                      );
                    }

                    return name;
                  },
                ),
              ),
            ];

          let connection;

          for (
            let attempt = 1;
            attempt <= 30;
            attempt += 1
          ) {
            try {
              connection =
                await mysql
                  .createConnection(
                    rootUrl,
                  );

              break;
            } catch (
              error
            ) {
              if (
                attempt === 30
              ) {
                throw error;
              }

              await new Promise(
                (resolve) =>
                  setTimeout(
                    resolve,
                    1000,
                  ),
              );
            }
          }

          try {
            for (
              const databaseName
              of databaseNames
            ) {
              await connection.query(
                `DROP DATABASE IF EXISTS \`${databaseName}\``,
              );

              await connection.query(
                `CREATE DATABASE \`${databaseName}\``,
              );
            }
          } finally {
            await connection.end();
          }
          NODE

      - name: Run control-plane MySQL migration gate
        run: |
          set -euo pipefail

          pnpm \
            --filter @claimguard/control-plane-database \
            exec node \
            --test tests/mysql.integration.test.js

      - name: Run canonical operational MySQL gate
        run: |
          set -euo pipefail

          pnpm \
            --filter @claimguard/database \
            exec node \
            --test tests/mysql.integration.test.js

      - name: Run Phase 11D routed API MySQL gate
        run: |
          set -euo pipefail

          pnpm \
            --filter @claimguard/api \
            exec node \
            --test tests/phase11d-mysql.integration.test.js

      - name: Run private provisioning MySQL gate
        run: |
          set -euo pipefail

          pnpm \
            --filter @claimguard/provisioning-worker \
            exec node \
            --test tests/mysql.integration.test.js

  deploy:
    runs-on: ubuntu-latest
    environment: production
    needs:
      - validate
      - mysql-integration
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.production_confirmation == 'DEPLOY_PRODUCTION' && inputs.expected_main_sha == github.sha
    concurrency:
      group: claimguard-production
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Download deployable artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: claimguard-deploy-packages
          path: /tmp/claimguard-deploy-packages

      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm

      - name: Install migration dependencies from the lockfile
        run: pnpm install --frozen-lockfile

      - name: Azure login with OIDC
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
          audience: api://AzureADTokenExchange

      - name: Run control-plane and operational database migrations
        env:
          OPERATIONAL_ADMIN_MODE: legacy_shared
        run: |
          set -euo pipefail
          # Runtime database access is governed through Key Vault, not App Service values.
          export CONTROL_PLANE_MYSQL_URL="$(az keyvault secret show \
            --vault-name "$AZURE_KEYVAULT_NAME" \
            --name "$CONTROL_PLANE_MYSQL_URL_SECRET_NAME" \
            --query value \
            --output tsv)"
          export MYSQL_URL="$(az keyvault secret show \
            --vault-name "$AZURE_KEYVAULT_NAME" \
            --name "$MYSQL_URL_SECRET_NAME" \
            --query value \
            --output tsv)"

          if [ -z "$CONTROL_PLANE_MYSQL_URL" ]; then
            echo "Error: CONTROL_PLANE_MYSQL_URL not found in Key Vault"
            exit 1
          fi
          if [ -z "$MYSQL_URL" ]; then
            echo "Error: MYSQL_URL not found in Key Vault"
            exit 1
          fi

          pnpm --filter @claimguard/control-plane-database migrate
          pnpm --filter @claimguard/database migrate

      - name: Authorize the exact governed release
        id: release_authorization
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PROMOTION_REQUEST_ID: ${{ inputs.promotion_request_id }}
        run: |
          set -euo pipefail
          export CONTROL_PLANE_MYSQL_URL="$(
            az keyvault secret show \
              --vault-name "$AZURE_KEYVAULT_NAME" \
              --name "$CONTROL_PLANE_MYSQL_URL_SECRET_NAME" \
              --query value \
              --output tsv
          )"
          test -n "$CONTROL_PLANE_MYSQL_URL"

          WORKFLOW_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          ACTOR="github-actions:${GITHUB_REPOSITORY}:${GITHUB_RUN_ID}"

          if [ -z "$PROMOTION_REQUEST_ID" ]; then
            SECURITY_RUNS="$(
              gh run list \
                --workflow codeql.yml \
                --commit "$GITHUB_SHA" \
                --event push \
                --status completed \
                --limit 20 \
                --json databaseId,conclusion,headSha,url
            )"
            SECURITY_RUN_ID="$(
              echo "$SECURITY_RUNS" \
                | jq -r --arg sha "$GITHUB_SHA" \
                  '[.[] | select(.conclusion == "success" and .headSha == $sha)][0].databaseId // empty'
            )"
            SECURITY_RUN_URL="$(
              echo "$SECURITY_RUNS" \
                | jq -r --arg sha "$GITHUB_SHA" \
                  '[.[] | select(.conclusion == "success" and .headSha == $sha)][0].url // empty'
            )"
            test -n "$SECURITY_RUN_ID"
            test -n "$SECURITY_RUN_URL"

            RELEASE_REGISTER_JSON="$(
              pnpm --filter @claimguard/control-plane-database exec node src/cli.js release-register \
                --commit-sha="$GITHUB_SHA" \
                --repository="$GITHUB_REPOSITORY" \
                --branch=main \
                --artifact-digest="$(jq -r .artifactDigest /tmp/claimguard-deploy-packages/release-manifest.json)" \
                --web-artifact-digest="$(jq -r .webArtifactDigest /tmp/claimguard-deploy-packages/release-manifest.json)" \
                --api-artifact-digest="$(jq -r .apiArtifactDigest /tmp/claimguard-deploy-packages/release-manifest.json)" \
                --artifact-name=claimguard-deploy-packages \
                --artifact-workflow-run-id="$GITHUB_RUN_ID" \
                --artifact-workflow-run-url="$WORKFLOW_URL" \
                --ci-workflow-run-id="$GITHUB_RUN_ID" \
                --ci-workflow-run-url="$WORKFLOW_URL" \
                --security-workflow-run-id="$SECURITY_RUN_ID" \
                --security-workflow-run-url="$SECURITY_RUN_URL" \
                --actor="$ACTOR" \
                --correlation-id="$GITHUB_RUN_ID"
            )"
            RELEASE_ID="$(echo "$RELEASE_REGISTER_JSON" | jq -r .release.releaseId)"
            AUTHORIZATION_JSON="$(
              pnpm --filter @claimguard/control-plane-database exec node src/cli.js release-bootstrap \
                --release-id="$RELEASE_ID" \
                --workflow-run-id="$GITHUB_RUN_ID" \
                --workflow-run-url="$WORKFLOW_URL" \
                --actor="$ACTOR" \
                --correlation-id="$GITHUB_RUN_ID"
            )"
          else
            AUTHORIZATION_JSON="$(
              pnpm --filter @claimguard/control-plane-database exec node src/cli.js release-authorize \
                --promotion-request-id="$PROMOTION_REQUEST_ID" \
                --commit-sha="$GITHUB_SHA" \
                --workflow-run-id="$GITHUB_RUN_ID" \
                --workflow-run-url="$WORKFLOW_URL" \
                --actor="$ACTOR" \
                --correlation-id="$GITHUB_RUN_ID"
            )"
          fi

          echo "promotion_request_id=$(echo "$AUTHORIZATION_JSON" | jq -r .promotionRequest.promotionRequestId)" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$(echo "$AUTHORIZATION_JSON" | jq -r .release.artifactName)" >> "$GITHUB_OUTPUT"
          echo "artifact_run_id=$(echo "$AUTHORIZATION_JSON" | jq -r .release.artifactWorkflowRunId)" >> "$GITHUB_OUTPUT"
          echo "artifact_digest=$(echo "$AUTHORIZATION_JSON" | jq -r .release.artifactDigest)" >> "$GITHUB_OUTPUT"
          echo "web_artifact_digest=$(echo "$AUTHORIZATION_JSON" | jq -r .release.webArtifactDigest)" >> "$GITHUB_OUTPUT"
          echo "api_artifact_digest=$(echo "$AUTHORIZATION_JSON" | jq -r .release.apiArtifactDigest)" >> "$GITHUB_OUTPUT"

      - name: Download the approved immutable release artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ steps.release_authorization.outputs.artifact_name }}
          path: /tmp/claimguard-governed-release
          github-token: ${{ github.token }}
          run-id: ${{ steps.release_authorization.outputs.artifact_run_id }}

      - name: Verify governed release artifact digests
        shell: bash
        env:
          EXPECTED_ARTIFACT_DIGEST: ${{ steps.release_authorization.outputs.artifact_digest }}
          EXPECTED_WEB_ARTIFACT_DIGEST: ${{ steps.release_authorization.outputs.web_artifact_digest }}
          EXPECTED_API_ARTIFACT_DIGEST: ${{ steps.release_authorization.outputs.api_artifact_digest }}
        run: |
          set -euo pipefail
          test "$(jq -r .commitSha /tmp/claimguard-governed-release/release-manifest.json)" = "$GITHUB_SHA"
          test "$(jq -r .artifactDigest /tmp/claimguard-governed-release/release-manifest.json)" = "$EXPECTED_ARTIFACT_DIGEST"
          test "$(sha256sum /tmp/claimguard-governed-release/claimguard-web-deploy.zip | cut -d' ' -f1)" = "$EXPECTED_WEB_ARTIFACT_DIGEST"
          test "$(sha256sum /tmp/claimguard-governed-release/claimguard-api-deploy.zip | cut -d' ' -f1)" = "$EXPECTED_API_ARTIFACT_DIGEST"

      - name: Deploy web app with retry
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_on: error
          command: >
            az webapp deploy
            --resource-group "$AZURE_RESOURCE_GROUP"
            --name "$AZURE_WEBAPP_WEB"
            --type zip
            --src-path /tmp/claimguard-governed-release/claimguard-web-deploy.zip
            --clean false
            --track-status true
            --timeout 1800000

      - name: Deploy API app with retry
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_on: error
          command: >
            az webapp deploy
            --resource-group "$AZURE_RESOURCE_GROUP"
            --name "$AZURE_WEBAPP_API"
            --type zip
            --src-path /tmp/claimguard-governed-release/claimguard-api-deploy.zip
            --clean false
            --track-status true
            --timeout 1800000

      - name: Configure production observability boundaries
        env:
          CLAIMGUARD_RELEASE: ${{ github.sha }}
        run: bash infra/configure-app-service-observability.sh

      - name: Verify deployment health endpoints
        run: |
          set -euo pipefail
          API_HEALTH_URL="https://${AZURE_WEBAPP_API}.azurewebsites.net/health"
          API_READY_URL="https://${AZURE_WEBAPP_API}.azurewebsites.net/ready"
          WEB_ROOT_URL="https://${AZURE_WEBAPP_WEB}.azurewebsites.net/"
          WEB_INDEX_URL="https://${AZURE_WEBAPP_WEB}.azurewebsites.net/index.html"

          # Allow up to 5 minutes for App Service warm-up after deployment.
          for attempt in $(seq 1 30); do
            API_HEALTH_STATUS="$(curl -sS -o /dev/null -w "%{http_code}" "$API_HEALTH_URL" || true)"
            API_READY_BODY="$(curl -sS -w $'\n%{http_code}' "$API_READY_URL" || true)"
            API_READY_STATUS="$(echo "$API_READY_BODY" | tail -n 1)"
            API_READY_JSON="$(echo "$API_READY_BODY" | sed '$d')"
            WEB_ROOT_STATUS="$(curl -sS -o /dev/null -w "%{http_code}" "$WEB_ROOT_URL" || true)"
            WEB_INDEX_STATUS="$(curl -sS -o /dev/null -w "%{http_code}" "$WEB_INDEX_URL" || true)"

            API_OK=0
            WEB_OK=0

            if [ "$API_HEALTH_STATUS" = "200" ] \
              && [ "$API_READY_STATUS" = "200" ] \
              && echo "$API_READY_JSON" | jq -e '.checks.desktopEnrollmentConfigured == true' >/dev/null; then
              API_OK=1
            fi

            if [ "$WEB_ROOT_STATUS" = "200" ] || [ "$WEB_ROOT_STATUS" = "301" ] || [ "$WEB_ROOT_STATUS" = "302" ] || [ "$WEB_INDEX_STATUS" = "200" ]; then
              WEB_OK=1
            fi

            if [ "$API_OK" = "1" ] && [ "$WEB_OK" = "1" ]; then
              echo "Deployment verification passed on attempt $attempt"
              exit 0
            fi

            DESKTOP_READY="$(echo "$API_READY_JSON" | jq -r '.checks.desktopEnrollmentConfigured // false' 2>/dev/null || echo false)"
            echo "Attempt $attempt: api_health=$API_HEALTH_STATUS api_ready=$API_READY_STATUS desktop_enrollment=$DESKTOP_READY web_root=$WEB_ROOT_STATUS web_index=$WEB_INDEX_STATUS"
            sleep 10
          done

          echo "Deployment verification failed after retries."
          exit 1

      - name: Record the completed production deployment
        shell: bash
        env:
          GOVERNED_PROMOTION_REQUEST_ID: ${{ steps.release_authorization.outputs.promotion_request_id }}
        run: |
          set -euo pipefail
          export CONTROL_PLANE_MYSQL_URL="$(
            az keyvault secret show \
              --vault-name "$AZURE_KEYVAULT_NAME" \
              --name "$CONTROL_PLANE_MYSQL_URL_SECRET_NAME" \
              --query value \
              --output tsv
          )"
          pnpm --filter @claimguard/control-plane-database exec node src/cli.js release-complete \
            --promotion-request-id="$GOVERNED_PROMOTION_REQUEST_ID" \
            --actor="github-actions:${GITHUB_REPOSITORY}:${GITHUB_RUN_ID}" \
            --correlation-id="$GITHUB_RUN_ID"

      - name: Capture bounded App Service diagnostics on deploy failure
        if: failure()
        run: |
          set +e
          mkdir -p /tmp/claimguard-failure-diagnostics

          echo "## App Service runtime summary"
          az webapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_API" \
            --query '{state:state,host:defaultHostName,linuxFxVersion:siteConfig.linuxFxVersion}' \
            --output json

          echo "## Startup command"
          az webapp config show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_API" \
            --query 'appCommandLine' \
            --output tsv

          echo "## Runtime-related app settings (presence only)"
          az webapp config appsettings list \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_API" \
            --query "[?name=='WEBSITE_NODE_DEFAULT_VERSION' || name=='WEBSITE_RUN_FROM_PACKAGE' || name=='SCM_DO_BUILD_DURING_DEPLOYMENT' || name=='WEBSITES_PORT'].{name:name,configured:join('', ['set'])}" \
            --output table

          echo "## Safe health probes"
          API_HEALTH_URL="https://${AZURE_WEBAPP_API}.azurewebsites.net/health"
          API_READY_URL="https://${AZURE_WEBAPP_API}.azurewebsites.net/ready"
          HEALTH_STATUS="$(curl -sS -m 15 -o /tmp/claimguard-failure-diagnostics/health-body.txt -w '%{http_code}' "$API_HEALTH_URL" || true)"
          READY_STATUS="$(curl -sS -m 15 -o /tmp/claimguard-failure-diagnostics/ready-body.txt -w '%{http_code}' "$API_READY_URL" || true)"
          echo "health_status=${HEALTH_STATUS}"
          echo "ready_status=${READY_STATUS}"
          sed -n '1,120p' /tmp/claimguard-failure-diagnostics/health-body.txt
          sed -n '1,200p' /tmp/claimguard-failure-diagnostics/ready-body.txt

          echo "## Download bounded app logs"
          az webapp log download \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_API" \
            --log-file /tmp/claimguard-failure-diagnostics/api-logs.zip >/dev/null

          mkdir -p /tmp/claimguard-failure-diagnostics/logs
          unzip -q -o /tmp/claimguard-failure-diagnostics/api-logs.zip -d /tmp/claimguard-failure-diagnostics/logs

          echo "## Recent startup and container exceptions (redacted)"
          grep -RInE "Error:|Exception|MODULE_NOT_FOUND|Cannot find module|Unhandled|exited with code|Killed|failed to start|ContainerTimeout|SiteStartupCancelled|node src/backend-server.js" /tmp/claimguard-failure-diagnostics/logs/LogFiles | tail -n 200 \
            | sed -E 's#(https?://)[^ @]+@#\\1REDACTED@#g; s#(password|pwd|token|secret|connectionstring|cookie|authorization)[^[:space:]]*#\\1=REDACTED#Ig; s#(AccountKey=)[^;]+#\\1REDACTED#Ig; s#(SharedAccessKey=)[^;]+#\\1REDACTED#Ig'

      - name: Record failed governed deployment
        if: (failure() || cancelled()) && steps.release_authorization.outputs.promotion_request_id != ''
        shell: bash
        env:
          GOVERNED_PROMOTION_REQUEST_ID: ${{ steps.release_authorization.outputs.promotion_request_id }}
        run: |
          set +e
          export CONTROL_PLANE_MYSQL_URL="$(
            az keyvault secret show \
              --vault-name "$AZURE_KEYVAULT_NAME" \
              --name "$CONTROL_PLANE_MYSQL_URL_SECRET_NAME" \
              --query value \
              --output tsv
          )"
          pnpm --filter @claimguard/control-plane-database exec node src/cli.js release-fail \
            --promotion-request-id="$GOVERNED_PROMOTION_REQUEST_ID" \
            --failure-summary="Production deployment workflow failed. Inspect the linked GitHub Actions run." \
            --actor="github-actions:${GITHUB_REPOSITORY}:${GITHUB_RUN_ID}" \
            --correlation-id="$GITHUB_RUN_ID"
