name: apply-desktop-claim-context-once

on:
  pull_request:
    branches: [main]
    paths:
      - .github/scripts/apply-desktop-claim-context.py
      - .github/scripts/fix-desktop-context-tests.py
      - .github/workflows/apply-desktop-claim-context-once.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'feat/desktop-claim-investigation-context' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: pnpm

      - name: Apply focused implementation
        run: |
          python .github/scripts/apply-desktop-claim-context.py
          python .github/scripts/fix-desktop-context-tests.py

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate focused packages
        run: |
          pnpm --filter @claimguard/database test
          pnpm --filter @claimguard/desktop test
          pnpm --filter @claimguard/desktop build
          node --check packages/database/src/claims-read-repository.js
          node --check packages/database/src/claim-ingestion-repository.js
          git diff --check

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: expose desktop claim investigation context"
          git push origin HEAD:${{ github.head_ref }}
