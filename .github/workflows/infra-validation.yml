name: infra-validation

on:
  pull_request:
    paths:
      - 'infra/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/main_claimguard-api.yml'
      - '.github/workflows/report-worker-deploy.yml'
      - '.github/workflows/ensemble211-release-stage.yml'
      - '.github/workflows/ensemble211-release-finalize.yml'
      - '.github/workflows/infra-validation.yml'
      - 'tools/validate-deployment-boundaries.mjs'
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/main_claimguard-api.yml'
      - '.github/workflows/report-worker-deploy.yml'
      - '.github/workflows/ensemble211-release-stage.yml'
      - '.github/workflows/ensemble211-release-finalize.yml'
      - '.github/workflows/infra-validation.yml'
      - 'tools/validate-deployment-boundaries.mjs'

permissions:
  contents: read

jobs:
  validate-event-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Compile event-worker Bicep
        shell: bash
        run: |
          set -euo pipefail
          az bicep build --file infra/event-report-worker.bicep --stdout >/dev/null
          az bicep build --file infra/recovery-job-bootstrap.bicep --stdout >/dev/null
          az bicep build --file infra/ensemble211-production.bicep --stdout >/dev/null

      - name: Validate production deployment boundaries
        run: |
          node --test \
            tools/tests/bootstrap-report-recovery-job.test.mjs \
            tools/tests/validate-deployment-boundaries.test.mjs \
            tools/tests/verify-api-health.test.mjs \
            tools/tests/verify-model-readiness.test.mjs

      - name: Validate deployment workflow invariants
        shell: python
        run: |
          from pathlib import Path

          workflow = Path('.github/workflows/report-worker-deploy.yml').read_text(encoding='utf-8')
          bootstrap = Path('infra/bootstrap-report-recovery-job.sh').read_text(encoding='utf-8')
          model_readiness = Path('infra/verify-model-readiness.sh').read_text(encoding='utf-8')
          workflow_required = [
              'infra/event-report-worker.bicep',
              'infra/bootstrap-report-recovery-job.sh',
              'infra/verify-api-health.sh',
              'Storage Queue Data Message Sender',
              'Storage Queue Data Contributor',
              'CLAIM_SCORING_QUEUE_URL',
              'EVENT_EXECUTION_COUNT_BEFORE',
              'RECOVERY_EXECUTION_COUNT_BEFORE',
              'QUEUE_PEEK_COUNT_BEFORE',
              'QUEUE_PEEK_COUNT_AFTER',
              'MODEL_SETTINGS_BEFORE',
              'triggerType',
              'worker event',
              'worker drain-all',
              'Verify API health after claim-scoring restart',
              'CLAIMGUARD_RELEASE_CANDIDATE_ARTIFACT_SHA256',
              'CLAIMGUARD_RELEASE_CANDIDATE_IMAGE_DIGEST',
              'CLAIMGUARD_RELEASE_IMAGE_DIGEST',
              'claimguard-claim-fraud-baseline:1.0.0,claimguard-claim-fraud-ensemble:2.1.1',
          ]
          missing = [value for value in workflow_required if value not in workflow]
          if missing:
              raise SystemExit(f'Missing event-worker deployment invariants: {missing}')
          bootstrap_required = [
              'infra/recovery-job-bootstrap.bicep',
              'az containerapp job identity assign',
          ]
          missing = [value for value in bootstrap_required if value not in bootstrap]
          if missing:
              raise SystemExit(f'Missing recovery-bootstrap invariants: {missing}')
          model_readiness_required = [
              'MODEL_READINESS_DEADLINE_SECONDS',
              'MODEL_READINESS_REQUEST_TIMEOUT_SECONDS',
              'MODEL_READINESS_RETRY_SECONDS',
              'EXPECTED_MODEL_DEPLOYMENT_ID',
          ]
          missing = [value for value in model_readiness_required if value not in model_readiness]
          if missing:
              raise SystemExit(f'Missing model-readiness invariants: {missing}')

          forbidden = [
              'infra/report-worker.bicep',
              'PARKED_WORKER_CRON',
              '--cron-expression',
          ]
          present = [value for value in forbidden if value in workflow]
          if present:
              raise SystemExit(f'Parked-worker deployment references remain: {present}')
