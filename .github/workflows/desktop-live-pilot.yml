name: desktop-live-pilot

on:
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: Exact 40-character main commit SHA approved for the live pilot artifact
        required: true
        type: string
      confirmation:
        description: Type BUILD LIVE DESKTOP PILOT (unsigned; does not deploy or publish)
        required: true
        type: string

concurrency:
  group: desktop-live-pilot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90
    environment: desktop-pilot
    env:
      CLAIMGUARD_ACTIVATION_ORIGIN: ${{ vars.DESKTOP_ACTIVATION_ORIGIN }}
      CLAIMGUARD_ENROLLMENT_VERIFYING_JWK: ${{ vars.DESKTOP_ENROLLMENT_VERIFYING_JWK }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Validate explicit live-pilot authorization and public trust
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -ne "refs/heads/main") { throw "Live pilot builds are restricted to main." }
          if ("${{ inputs.expected_main_sha }}" -notmatch "^[0-9a-f]{40}$") { throw "expected_main_sha must be a full SHA." }
          if ("${{ inputs.expected_main_sha }}" -ne $env:GITHUB_SHA) { throw "The approved SHA does not match this run." }
          if ("${{ inputs.confirmation }}" -cne "BUILD LIVE DESKTOP PILOT") { throw "Confirmation did not match." }
          if ([string]::IsNullOrWhiteSpace($env:CLAIMGUARD_ACTIVATION_ORIGIN)) { throw "DESKTOP_ACTIVATION_ORIGIN is required." }
          try { $origin = [Uri]::new($env:CLAIMGUARD_ACTIVATION_ORIGIN) } catch { throw "DESKTOP_ACTIVATION_ORIGIN is invalid." }
          if (-not $origin.IsAbsoluteUri -or $origin.Scheme -ne "https" -or $origin.AbsolutePath -ne "/" -or $origin.Query -or $origin.Fragment) { throw "The live desktop origin must be an HTTPS origin without a path, query, or fragment." }
          if ($origin.Host -match "\.invalid$" -or $origin.Host -eq "localhost") { throw "Placeholder and local origins are forbidden." }
          try { $jwk = $env:CLAIMGUARD_ENROLLMENT_VERIFYING_JWK | ConvertFrom-Json } catch { throw "DESKTOP_ENROLLMENT_VERIFYING_JWK is invalid JSON." }
          if ($jwk.kty -ne "OKP" -or $jwk.crv -ne "Ed25519" -or $jwk.x -notmatch "^[A-Za-z0-9_-]{43}$" -or [string]::IsNullOrWhiteSpace($jwk.kid)) { throw "A keyed Ed25519 enrollment-verification JWK is required." }

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm

      - name: Set up stable Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify medical-scheme desktop and API boundaries
        run: |
          pnpm --filter @claimguard/desktop test
          pnpm --filter @claimguard/desktop build
          pnpm --filter @claimguard/control-plane-database test
          pnpm --filter @claimguard/database test
          pnpm --filter @claimguard/api test

      - name: Verify native security boundary
        working-directory: apps/desktop/src-tauri
        run: |
          cargo fmt --all --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --all-targets --locked

      - name: Install pinned Tauri CLI
        run: cargo install tauri-cli --version 2.11.4 --locked

      - name: Prepare disposable pilot updater trust
        shell: pwsh
        working-directory: apps/desktop/src-tauri
        run: |
          $privateKey = Join-Path $env:RUNNER_TEMP "claimguard-live-pilot-updater.key"
          cargo tauri signer generate --ci --force -w $privateKey
          $publicKey = Get-Content -Raw "$privateKey.pub"
          $configuration = Get-Content -Raw "tauri.conf.json" | ConvertFrom-Json
          $configuration.plugins.updater.pubkey = $publicKey.Trim()
          $configuration | ConvertTo-Json -Depth 100 | Set-Content -Encoding UTF8 "tauri.conf.json"
          "CLAIMGUARD_PILOT_UPDATER_PRIVATE_KEY=$privateKey" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build live API pilot installer
        shell: pwsh
        working-directory: apps/desktop/src-tauri
        run: |
          $env:TAURI_SIGNING_PRIVATE_KEY = $env:CLAIMGUARD_PILOT_UPDATER_PRIVATE_KEY
          $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD = ""
          cargo tauri build --bundles nsis

      - name: Normalize and label disposable pilot artifact
        shell: pwsh
        run: |
          & "tools/verify-windows-gui-subsystem.ps1" -ExecutablePath "apps/desktop/src-tauri/target/release/claim-guard-desktop.exe"
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $installers = @(Get-ChildItem "apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe")
          if ($installers.Count -ne 1) { throw "Expected exactly one NSIS setup executable." }
          Copy-Item $installers[0].FullName "artifacts/ClaimGuard-Live-Pilot-Setup.exe"
          $authenticode = Get-AuthenticodeSignature "artifacts/ClaimGuard-Live-Pilot-Setup.exe"
          if ($authenticode.Status -ne "NotSigned") { throw "The pilot artifact must remain distinct from the protected signed-release path." }
          $signatures = @(Get-ChildItem "apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe.sig")
          if ($signatures.Count -ne 1) { throw "Expected one disposable Tauri signature for the pilot installer." }
          Copy-Item $signatures[0].FullName "artifacts/ClaimGuard-Live-Pilot-Setup.exe.sig"
          $jwk = $env:CLAIMGUARD_ENROLLMENT_VERIFYING_JWK | ConvertFrom-Json
          $hash = (Get-FileHash "artifacts/ClaimGuard-Live-Pilot-Setup.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          [ordered]@{
            artifactClass = "live_api_disposable_pilot"
            commitSha = $env:GITHUB_SHA
            apiOrigin = $env:CLAIMGUARD_ACTIVATION_ORIGIN
            enrollmentSigningKeyId = $jwk.kid
            authenticode = "not_signed"
            updaterTrust = "ephemeral_not_upgradeable"
            sha256 = $hash
          } | ConvertTo-Json | Set-Content -Encoding UTF8 "artifacts/build-metadata.json"

      - name: Upload live pilot without publishing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ClaimGuard-Live-Pilot-Windows-Setup-${{ github.sha }}
          path: |
            artifacts/ClaimGuard-Live-Pilot-Setup.exe
            artifacts/ClaimGuard-Live-Pilot-Setup.exe.sig
            artifacts/build-metadata.json
          if-no-files-found: error
          retention-days: 7
