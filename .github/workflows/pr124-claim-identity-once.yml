name: Apply PR 124 claim identity presentation

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'docs/human-supervised-network-governance' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/human-supervised-network-governance
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply identity presentation patch
        run: python3 .github/scripts/apply-pr124-identity.py
      - name: Validate JavaScript repository source
        run: node --check packages/database/src/claims-read-repository.js
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: show claim member and provider identities"
          git push origin HEAD:docs/human-supervised-network-governance
