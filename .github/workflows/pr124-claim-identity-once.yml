name: Apply PR 124 claim identity presentation

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'docs/human-supervised-network-governance' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: docs/human-supervised-network-governance
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
      - name: Narrow additive replacements to the first matching query
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/apply-pr124-identity.py')
          text = path.read_text()
          original = '    if count != 1:\n        raise RuntimeError(f"{label}: expected one match, found {count}")\n    return text.replace(old, new, 1)'
          replacement = '    if count < 1:\n        raise RuntimeError(f"{label}: expected at least one match, found {count}")\n    return text.replace(old, new, 1)'
          if original not in text:
              raise SystemExit('replace_once helper did not match expected source')
          path.write_text(text.replace(original, replacement, 1))
          PY
      - name: Apply identity presentation patch
        run: python3 .github/scripts/apply-pr124-identity.py
      - name: Validate JavaScript repository source
        run: node --check packages/database/src/claims-read-repository.js
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: show claim member and provider identities"
          git push origin HEAD:docs/human-supervised-network-governance
