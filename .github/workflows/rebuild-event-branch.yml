name: rebuild-event-branch

on:
  push:
    branches:
      - feat/event-driven-claim-scoring-main

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/event-driven-claim-scoring-main
          fetch-depth: 0

      - name: Copy validated event-scoring files
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feat/event-driven-claim-scoring
          files=(
            apps/api/src/routes/claims-routes.js
            apps/api/src/services/claim-ingestion-service.js
            apps/api/src/services/claim-wakeup-publisher.js
            apps/api/tests/claim-wakeup-publisher.test.js
            infra/bootstrap-report-worker-rbac.sh
            infra/event-report-worker.bicep
            packages/database/src/claim-ingestion-repository.js
            packages/database/tests/claim-ingestion-identifier-contract.test.js
            services/report-producer/src/claimguard_report_producer/cli.py
            services/report-producer/src/claimguard_report_producer/event_queue.py
            tools/scheme-simulator/build-windows.ps1
            tools/scheme-simulator/schemes.example.json
            tools/scheme-simulator/simulator.py
          )
          for path in "${files[@]}"; do
            mkdir -p "$(dirname "$path")"
            git show "origin/feat/event-driven-claim-scoring:$path" > "$path"
          done
          rm .github/workflows/rebuild-event-branch.yml

      - name: Commit clean main-based change set
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add event-driven scoring and Windows simulator"
          git push origin HEAD:feat/event-driven-claim-scoring-main
