name: "CodeQL"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '30 1 * * 0'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'javascript-typescript', 'python' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

    - name: Initialize CodeQL
      uses: github/codeql-action/init@4187e74d05793876e9989daffde9c3e66b4acd07
      with:
        languages: ${{ matrix.language }}

    - name: Autobuild
      uses: github/codeql-action/autobuild@5595ccaf912efad79be6eef63a5619ff05969be3

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@4187e74d05793876e9989daffde9c3e66b4acd07
      with:
        category: "/language:${{matrix.language}}"
