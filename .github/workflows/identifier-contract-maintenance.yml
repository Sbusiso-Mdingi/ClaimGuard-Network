name: identifier-contract-maintenance

on:
  push:
    branches:
      - feat/event-driven-claim-scoring

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/event-driven-claim-scoring
          fetch-depth: 0

      - name: Apply guarded identifier-width patch
        shell: python
        run: |
          from pathlib import Path

          repository = Path("packages/database/src/claim-ingestion-repository.js")
          text = repository.read_text(encoding="utf-8")
          replacements = {
              "`claims[${index}].claim_id`,\n      32,": "`claims[${index}].claim_id`,\n      128,",
              "`claims[${index}].scheme_id`,\n      8,": "`claims[${index}].scheme_id`,\n      64,",
              "`claims[${index}].member_id`,\n      32,": "`claims[${index}].member_id`,\n      128,",
              "`claims[${index}].provider_id`,\n      32,": "`claims[${index}].provider_id`,\n      128,",
              "`claims[${index}].billing_code`,\n      32,": "`claims[${index}].billing_code`,\n      64,",
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one occurrence of {old!r}; found {count}.")
              text = text.replace(old, new)
          repository.write_text(text, encoding="utf-8")

          simulator = Path("tools/scheme-simulator/simulator.py")
          text = simulator.read_text(encoding="utf-8")
          old = 'if not scheme_id or len(scheme_id) > 8:\n            raise ValueError("scheme_id must contain 1 to 8 characters for the current ClaimGuard database contract.")'
          new = 'if not scheme_id or len(scheme_id) > 64:\n            raise ValueError("scheme_id must contain 1 to 64 characters for the ClaimGuard ingestion contract.")'
          if text.count(old) != 1:
              raise SystemExit("The simulator scheme-id guard did not match the expected source.")
          simulator.write_text(text.replace(old, new), encoding="utf-8")

          test_file = Path("packages/database/tests/claim-ingestion-identifier-contract.test.js")
          test_file.write_text('''import assert from "node:assert/strict";\nimport { readFile } from "node:fs/promises";\nimport test from "node:test";\n\nconst sourceUrl = new URL("../src/claim-ingestion-repository.js", import.meta.url);\n\ntest("claim ingestion repository mirrors the migrated identifier widths", async () => {\n  const source = await readFile(sourceUrl, "utf8");\n  const expected = [\n    [/`claims\\[\\$\\{index\\}\\]\\.claim_id`,\\s*128,/, "claim_id"],\n    [/`claims\\[\\$\\{index\\}\\]\\.scheme_id`,\\s*64,/, "scheme_id"],\n    [/`claims\\[\\$\\{index\\}\\]\\.member_id`,\\s*128,/, "member_id"],\n    [/`claims\\[\\$\\{index\\}\\]\\.provider_id`,\\s*128,/, "provider_id"],\n    [/`claims\\[\\$\\{index\\}\\]\\.billing_code`,\\s*64,/, "billing_code"],\n  ];\n  for (const [pattern, field] of expected) {\n    assert.match(source, pattern, `${field} validator must match migration 0010 and the public schema`);\n  }\n});\n''', encoding="utf-8")

          Path(".github/workflows/identifier-contract-maintenance.yml").unlink()

      - name: Commit the validated source patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/database/src/claim-ingestion-repository.js \
            packages/database/tests/claim-ingestion-identifier-contract.test.js \
            tools/scheme-simulator/simulator.py \
            .github/workflows/identifier-contract-maintenance.yml
          git commit -m "fix: align claim identifier validation with schema"
          git push origin HEAD:feat/event-driven-claim-scoring
