name: Report producer diagnostics

on:
  pull_request:
    paths:
      - "services/report-producer/**"
      - ".github/workflows/report-producer-diagnostics.yml"

permissions:
  contents: read

jobs:
  report-producer-tests:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990

      - name: Run report-producer tests verbosely
        id: tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p test-results
          uv run --project services/report-producer --frozen \
            python -m unittest discover \
            -v \
            -s services/report-producer/tests \
            -p 'test_*.py' \
            2>&1 | tee test-results/report-producer-tests.log

      - name: Upload report-producer test log
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: report-producer-test-log
          path: test-results/report-producer-tests.log
          if-no-files-found: error
          retention-days: 7
