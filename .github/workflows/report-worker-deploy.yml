name: report-worker-deploy

on:
  workflow_run:
    workflows: [ci]
    types: [completed]

concurrency:
  group: claimguard-report-worker-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  AZURE_WEBAPP_API: ${{ vars.AZURE_WEBAPP_API }}
  AZURE_KEYVAULT_NAME: ${{ vars.AZURE_KEYVAULT_NAME }}
  CONTROL_PLANE_MYSQL_URL_SECRET_NAME: ${{ vars.CONTROL_PLANE_MYSQL_URL_SECRET_NAME }}
  MYSQL_URL_SECRET_NAME: ${{ vars.MYSQL_URL_SECRET_NAME }}
  REPORT_WORKER_ACR_NAME: ${{ vars.REPORT_WORKER_ACR_NAME || 'claimguardacr11e' }}
  REPORT_WORKER_ENVIRONMENT_NAME: ${{ vars.REPORT_WORKER_ENVIRONMENT_NAME || 'claimguard-env-11e' }}
  REPORT_WORKER_IDENTITY_NAME: ${{ vars.REPORT_WORKER_IDENTITY_NAME || 'claimguard-report-worker-identity' }}
  REPORT_WORKER_JOB_NAME: ${{ vars.REPORT_WORKER_JOB_NAME || 'claimguard-report-producer' }}
  REPORT_WORKER_RECOVERY_JOB_NAME: ${{ vars.REPORT_WORKER_RECOVERY_JOB_NAME || 'claimguard-report-recovery' }}
  REPORT_WORKER_RECOVERY_CRON: ${{ vars.REPORT_WORKER_RECOVERY_CRON || '0 0 1 1 *' }}
  REPORT_STORAGE_ACCOUNT_NAME: ${{ vars.REPORT_STORAGE_ACCOUNT_NAME || 'cgrpt0715sa' }}
  REPORT_STORAGE_ACCOUNT_URL: ${{ vars.REPORT_STORAGE_ACCOUNT_URL || 'https://cgrpt0715sa.blob.core.windows.net' }}
  REPORT_STORAGE_CONTAINER: ${{ vars.REPORT_STORAGE_CONTAINER || 'claimguard-reports' }}
  EVIDENCE_STORAGE_CONTAINER: ${{ vars.EVIDENCE_STORAGE_CONTAINER || 'claimguard-investigation-evidence' }}
  CLAIM_SCORING_QUEUE_NAME: ${{ vars.CLAIM_SCORING_QUEUE_NAME || 'claimguard-claim-scoring' }}
  MODEL_SERVICE_BASE_URL: ${{ vars.PROSPECTIVE_MODEL_SERVICE_BASE_URL }}
  MODEL_SERVICE_AUDIENCE: ${{ vars.MODEL_SERVICE_AUDIENCE }}
  MODEL_SERVICE_ENDPOINT_PATH: /v3/claim-screening
  MODEL_DEPLOYMENT_ID: claimguard-claim-fraud-baseline:1.0.0
  MODEL_EXPECTED_ID: claimguard-claim-fraud-baseline
  MODEL_EXPECTED_VERSION: 1.0.0
  MODEL_EXPECTED_FEATURE_SCHEMA: claim-feature-schema-2026.2
  MODEL_EXPECTED_ANALYSIS_MODE: PROSPECTIVE_CLAIM_SCREENING
  MODEL_EXPECTED_BASELINE_THRESHOLD: '0.08760971001434723'
  ENSEMBLE_MODEL_SERVICE_BASE_URL: https://claimguard-ml-ensemble-211.livelydune-39b25d2c.southafricanorth.azurecontainerapps.io
  ENSEMBLE_DEPLOYMENT_ID: claimguard-claim-fraud-ensemble:2.1.1
  ENSEMBLE_RUNTIME_CONFIG_KEY: CLAIMGUARD_CLAIM_FRAUD_ENSEMBLE_2_1_1_E0652D762C0E
  ENSEMBLE_EXPECTED_ID: claimguard-claim-fraud-ensemble
  ENSEMBLE_EXPECTED_VERSION: 2.1.1
  ENSEMBLE_EXPECTED_THRESHOLD: '0.049236234887246655'
  WORKER_APPROVED_MODEL_DEPLOYMENT_IDS: claimguard-claim-fraud-baseline:1.0.0,claimguard-claim-fraud-ensemble:2.1.1
  API_APPROVED_MODEL_DEPLOYMENT_IDS: ${{ vars.CLAIMGUARD_APPROVED_MODEL_DEPLOYMENT_IDS || 'claimguard-claim-fraud-baseline:1.0.0' }}
  API_MANAGED_MODEL_DEPLOYMENT_ID: ${{ vars.CLAIMGUARD_MANAGED_MODEL_DEPLOYMENT_ID || 'claimguard-claim-fraud-baseline:1.0.0' }}
  RELEASE_ARTIFACT_SHA256: 644bbefaf14ac13c7eeb69965d6d53d29d150b632ec485b4bf9fd47297773d62
  RELEASE_CANDIDATE_IMAGE_DIGEST: claimguardacr11e.azurecr.io/claimguard/ensemble2-prospective-model-service@sha256:423a6f88b8fb28580c47950676714237f72b73f7273acbad21806afd06c8fd1a
  RELEASE_IMAGE_DIGEST: claimguardacr11e.azurecr.io/claimguard/ensemble2-prospective-model-service@sha256:0a4b771e8453b6f891e35b5a2921c2c840325ffd29bf773aa7989f5ef4241b2c
  MODEL_PSEUDONYM_SECRET_NAME: ${{ vars.MODEL_PSEUDONYM_SECRET_NAME || 'claimguard--report-worker--model-pseudonymization-key' }}
  VALIDATED_MAIN_SHA: ${{ github.event.workflow_run.head_sha }}

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the validated main commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ env.VALIDATED_MAIN_SHA }}

      - name: Azure login with OIDC
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
          audience: api://AzureADTokenExchange

      - name: Validate production worker configuration
        shell: bash
        env:
          MODEL_PSEUDONYMIZATION_KEY: ${{ secrets.MODEL_SERVICE_PSEUDONYMIZATION_KEY }}
        run: |
          set -euo pipefail
          required=(
            AZURE_RESOURCE_GROUP AZURE_WEBAPP_API AZURE_KEYVAULT_NAME
            CONTROL_PLANE_MYSQL_URL_SECRET_NAME MYSQL_URL_SECRET_NAME
            REPORT_WORKER_ACR_NAME REPORT_WORKER_ENVIRONMENT_NAME
            REPORT_WORKER_IDENTITY_NAME REPORT_WORKER_JOB_NAME
            REPORT_WORKER_RECOVERY_JOB_NAME REPORT_WORKER_RECOVERY_CRON
            REPORT_STORAGE_ACCOUNT_NAME REPORT_STORAGE_ACCOUNT_URL
            REPORT_STORAGE_CONTAINER EVIDENCE_STORAGE_CONTAINER CLAIM_SCORING_QUEUE_NAME
            MODEL_SERVICE_BASE_URL MODEL_SERVICE_AUDIENCE
            MODEL_SERVICE_ENDPOINT_PATH MODEL_DEPLOYMENT_ID
            MODEL_EXPECTED_ID MODEL_EXPECTED_VERSION
            MODEL_EXPECTED_FEATURE_SCHEMA MODEL_EXPECTED_ANALYSIS_MODE
            MODEL_EXPECTED_BASELINE_THRESHOLD MODEL_PSEUDONYM_SECRET_NAME
            ENSEMBLE_MODEL_SERVICE_BASE_URL ENSEMBLE_DEPLOYMENT_ID
            ENSEMBLE_RUNTIME_CONFIG_KEY ENSEMBLE_EXPECTED_ID
            ENSEMBLE_EXPECTED_VERSION ENSEMBLE_EXPECTED_THRESHOLD
            WORKER_APPROVED_MODEL_DEPLOYMENT_IDS
            API_APPROVED_MODEL_DEPLOYMENT_IDS API_MANAGED_MODEL_DEPLOYMENT_ID
            RELEASE_ARTIFACT_SHA256 RELEASE_CANDIDATE_IMAGE_DIGEST
            RELEASE_IMAGE_DIGEST
            MODEL_PSEUDONYMIZATION_KEY VALIDATED_MAIN_SHA
          )
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required production worker setting: $name"
              exit 1
            fi
          done

          case "$MODEL_SERVICE_BASE_URL" in
            https://*) ;;
            *) echo "PROSPECTIVE_MODEL_SERVICE_BASE_URL must be an HTTPS origin"; exit 1 ;;
          esac
          test "$MODEL_SERVICE_ENDPOINT_PATH" = "/v3/claim-screening"
          test "$MODEL_DEPLOYMENT_ID" = "claimguard-claim-fraud-baseline:1.0.0"
          test "$ENSEMBLE_DEPLOYMENT_ID" = "claimguard-claim-fraud-ensemble:2.1.1"
          test "$ENSEMBLE_RUNTIME_CONFIG_KEY" = "CLAIMGUARD_CLAIM_FRAUD_ENSEMBLE_2_1_1_E0652D762C0E"
          test "$WORKER_APPROVED_MODEL_DEPLOYMENT_IDS" = "$MODEL_DEPLOYMENT_ID,$ENSEMBLE_DEPLOYMENT_ID"
          if [ "$API_MANAGED_MODEL_DEPLOYMENT_ID" = "$MODEL_DEPLOYMENT_ID" ]; then
            test "$API_APPROVED_MODEL_DEPLOYMENT_IDS" = "$MODEL_DEPLOYMENT_ID"
          else
            test "$API_MANAGED_MODEL_DEPLOYMENT_ID" = "$ENSEMBLE_DEPLOYMENT_ID"
            test "$API_APPROVED_MODEL_DEPLOYMENT_IDS" = "$WORKER_APPROVED_MODEL_DEPLOYMENT_IDS"
          fi
          [[ "$CLAIM_SCORING_QUEUE_NAME" =~ ^[a-z0-9]([a-z0-9-]{1,61}[a-z0-9])?$ ]]
          [[ "$REPORT_WORKER_JOB_NAME" =~ ^[a-z]([a-z0-9-]{0,30}[a-z0-9])?$ ]]
          [[ "$REPORT_WORKER_RECOVERY_JOB_NAME" =~ ^[a-z]([a-z0-9-]{0,30}[a-z0-9])?$ ]]
          test "${#REPORT_WORKER_JOB_NAME}" -le 32
          test "${#REPORT_WORKER_RECOVERY_JOB_NAME}" -le 32
          test "$REPORT_WORKER_RECOVERY_CRON" = "0 0 1 1 *"

      - name: Ensure report-worker managed identity and pseudonym key
        shell: bash
        env:
          MODEL_PSEUDONYMIZATION_KEY: ${{ secrets.MODEL_SERVICE_PSEUDONYMIZATION_KEY }}
        run: |
          set -euo pipefail
          if ! az identity show --resource-group "$AZURE_RESOURCE_GROUP" --name "$REPORT_WORKER_IDENTITY_NAME" >/dev/null 2>&1; then
            az identity create --resource-group "$AZURE_RESOURCE_GROUP" --name "$REPORT_WORKER_IDENTITY_NAME" >/dev/null
          fi
          az keyvault secret set \
            --vault-name "$AZURE_KEYVAULT_NAME" \
            --name "$MODEL_PSEUDONYM_SECRET_NAME" \
            --value "$MODEL_PSEUDONYMIZATION_KEY" \
            --content-type application/vnd.claimguard.model-pseudonymization-key \
            >/dev/null

      - name: Capture deployment safety baseline
        shell: bash
        run: |
          set -euo pipefail
          EVENT_JOB_BEFORE="$(az containerapp job show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$REPORT_WORKER_JOB_NAME" \
            --output json)"
          test "$(echo "$EVENT_JOB_BEFORE" | jq -r '.properties.configuration.triggerType')" = "Event"
          test "$(echo "$EVENT_JOB_BEFORE" | jq -r '.properties.configuration.eventTriggerConfig.scale.minExecutions')" = "0"
          EVENT_MAX_BEFORE="$(echo "$EVENT_JOB_BEFORE" | jq -r '.properties.configuration.eventTriggerConfig.scale.maxExecutions')"
          test "$EVENT_MAX_BEFORE" = "2" || test "$EVENT_MAX_BEFORE" = "100"
          test "$(echo "$EVENT_JOB_BEFORE" | jq -r '.properties.template.containers[0].args | join(" ")')" = "worker event"
          test "$(echo "$EVENT_JOB_BEFORE" | jq -r '.properties.template.containers[0].env[] | select(.name == "MODEL_SERVICE_DEPLOYMENT_ID") | .value')" = "$MODEL_DEPLOYMENT_ID"

          EVENT_EXECUTION_COUNT_BEFORE="$(az containerapp job execution list \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$REPORT_WORKER_JOB_NAME" \
            --query 'length(@)' -o tsv)"
          EVENT_ACTIVE_BEFORE="$(az containerapp job execution list \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$REPORT_WORKER_JOB_NAME" \
            --query "length([?properties.status=='Running' || properties.status=='Processing'])" -o tsv)"

          if az containerapp job show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$REPORT_WORKER_RECOVERY_JOB_NAME" \
            >/dev/null 2>&1; then
            RECOVERY_EXECUTION_COUNT_BEFORE="$(az containerapp job execution list \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$REPORT_WORKER_RECOVERY_JOB_NAME" \
              --query 'length(@)' -o tsv)"
            RECOVERY_ACTIVE_BEFORE="$(az containerapp job execution list \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$REPORT_WORKER_RECOVERY_JOB_NAME" \
              --query "length([?properties.status=='Running' || properties.status=='Processing'])" -o tsv)"
            test "$RECOVERY_ACTIVE_BEFORE" = "0"
          else
            RECOVERY_EXECUTION_COUNT_BEFORE=0
          fi

          QUEUE_PEEK_COUNT_BEFORE="$(az storage message peek \
            --account-name "$REPORT_STORAGE_ACCOUNT_NAME" \
            --queue-name "$CLAIM_SCORING_QUEUE_NAME" \
            --num-messages 32 \
            --auth-mode key \
            --query 'length(@)' -o tsv)"

          MODEL_SETTINGS_BEFORE="$(az webapp config appsettings list \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_API" \
            --query "[?name=='APPROVED_MODEL_DEPLOYMENT_IDS' || name=='CLAIMGUARD_MANAGED_MODEL_DEPLOYMENT_ID'].{name:name,value:value}" \
            --output json)"
          test "$(echo "$MODEL_SETTINGS_BEFORE" | jq length)" -eq 2
          test "$(echo "$MODEL_SETTINGS_BEFORE" | jq -r '.[] | select(.name == "APPROVED_MODEL_DEPLOYMENT_IDS") | .value')" = "$API_APPROVED_MODEL_DEPLOYMENT_IDS"
          test "$(echo "$MODEL_SETTINGS_BEFORE" | jq -r '.[] | select(.name == "CLAIMGUARD_MANAGED_MODEL_DEPLOYMENT_ID") | .value')" = "$API_MANAGED_MODEL_DEPLOYMENT_ID"

          echo "EVENT_EXECUTION_COUNT_BEFORE=$EVENT_EXECUTION_COUNT_BEFORE" >> "$GITHUB_ENV"
          echo "EVENT_ACTIVE_BEFORE=$EVENT_ACTIVE_BEFORE" >> "$GITHUB_ENV"
          echo "RECOVERY_EXECUTION_COUNT_BEFORE=$RECOVERY_EXECUTION_COUNT_BEFORE" >> "$GITHUB_ENV"
          echo "QUEUE_PEEK_COUNT_BEFORE=$QUEUE_PEEK_COUNT_BEFORE" >> "$GITHUB_ENV"

      - name: Bootstrap identity-free recovery job and attach identity
        shell: bash
        run: bash infra/bootstrap-report-recovery-job.sh

      - name: Verify queue-scoped runtime RBAC before deployment
        shell: bash
        run: |
          set -euo pipefail
          WORKER_PRINCIPAL_ID="$(az identity show --resource-group "$AZURE_RESOURCE_GROUP" --name "$REPORT_WORKER_IDENTITY_NAME" --query principalId -o tsv)"
          API_PRINCIPAL_ID="$(az webapp identity show --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_WEBAPP_API" --query principalId -o tsv)"
          test -n "$API_PRINCIPAL_ID"
          test "$API_PRINCIPAL_ID" != "null"
          ACR_ID="$(az acr show --resource-group "$AZURE_RESOURCE_GROUP" --name "$REPORT_WORKER_ACR_NAME" --query id -o tsv)"
          KEY_VAULT_ID="$(az keyvault show --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_KEYVAULT_NAME" --query id -o tsv)"
          STORAGE_ID="$(az storage account show --resource-group "$AZURE_RESOURCE_GROUP" --name "$REPORT_STORAGE_ACCOUNT_NAME" --query id -o tsv)"
          CONTAINER_SCOPE="${STORAGE_ID}/blobServices/default/containers/${REPORT_STORAGE_CONTAINER}"
          EVIDENCE_CONTAINER_SCOPE="${STORAGE_ID}/blobServices/default/containers/${EVIDENCE_STORAGE_CONTAINER}"
          QUEUE_SCOPE="${STORAGE_ID}/queueServices/default/queues/${CLAIM_SCORING_QUEUE_NAME}"

          require_role() {
            local principal_id="$1"
            local role="$2"
            local scope="$3"
            local count
            count="$(az role assignment list --assignee-object-id "$principal_id" --scope "$scope" --query "[?roleDefinitionName=='${role}'] | length(@)" -o tsv)"
            if [ "$count" = "0" ]; then
              echo "Missing bootstrap role: $role on $scope for $principal_id"
              echo "Run infra/bootstrap-report-worker-rbac.sh as the subscription owner, then rerun this workflow."
              exit 1
            fi
          }

          require_role "$WORKER_PRINCIPAL_ID" "AcrPull" "$ACR_ID"
          require_role "$WORKER_PRINCIPAL_ID" "Key Vault Secrets User" "${KEY_VAULT_ID}/secrets/${CONTROL_PLANE_MYSQL_URL_SECRET_NAME}"
          require_role "$WORKER_PRINCIPAL_ID" "Key Vault Secrets User" "${KEY_VAULT_ID}/secrets/${MYSQL_URL_SECRET_NAME}"
          require_role "$WORKER_PRINCIPAL_ID" "Key Vault Secrets User" "${KEY_VAULT_ID}/secrets/${MODEL_PSEUDONYM_SECRET_NAME}"
          require_role "$WORKER_PRINCIPAL_ID" "Storage Blob Data Contributor" "$CONTAINER_SCOPE"
          require_role "$WORKER_PRINCIPAL_ID" "Storage Queue Data Contributor" "$QUEUE_SCOPE"
          require_role "$API_PRINCIPAL_ID" "Storage Blob Data Reader" "$CONTAINER_SCOPE"
          require_role "$API_PRINCIPAL_ID" "Storage Blob Data Contributor" "$EVIDENCE_CONTAINER_SCOPE"
          require_role "$API_PRINCIPAL_ID" "Storage Queue Data Message Sender" "$QUEUE_SCOPE"

      - name: Build and push immutable report-worker image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE_REPOSITORY="claimguard/report-producer"
          LOGIN_SERVER="$(az acr show --resource-group "$AZURE_RESOURCE_GROUP" --name "$REPORT_WORKER_ACR_NAME" --query loginServer -o tsv)"
          REPORT_WORKER_IMAGE="${LOGIN_SERVER}/${IMAGE_REPOSITORY}:${VALIDATED_MAIN_SHA}"
          az acr login --name "$REPORT_WORKER_ACR_NAME"
          docker build --pull --file services/report-producer/Dockerfile --tag "$REPORT_WORKER_IMAGE" .
          docker push "$REPORT_WORKER_IMAGE"
          echo "REPORT_WORKER_IMAGE=$REPORT_WORKER_IMAGE" >> "$GITHUB_ENV"

      - name: Deploy event scorer and scheduled recovery job
        shell: bash
        run: |
          set -euo pipefail
          OPERATIONAL_SCHEMA_VERSION="$(
            node --input-type=module --eval \
              "import { CANONICAL_OPERATIONAL_SCHEMA_VERSION } from './packages/database/src/operational-schema.js'; process.stdout.write(CANONICAL_OPERATIONAL_SCHEMA_VERSION)"
          )"
          az deployment group create \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "event-report-worker-${VALIDATED_MAIN_SHA::12}" \
            --template-file infra/event-report-worker.bicep \
            --parameters \
              containerAppsEnvironmentName="$REPORT_WORKER_ENVIRONMENT_NAME" \
              containerRegistryName="$REPORT_WORKER_ACR_NAME" \
              workerIdentityName="$REPORT_WORKER_IDENTITY_NAME" \
              keyVaultName="$AZURE_KEYVAULT_NAME" \
              controlPlaneSecretName="$CONTROL_PLANE_MYSQL_URL_SECRET_NAME" \
              operationalSecretName="$MYSQL_URL_SECRET_NAME" \
              modelPseudonymSecretName="$MODEL_PSEUDONYM_SECRET_NAME" \
              reportWorkerImage="$REPORT_WORKER_IMAGE" \
              operationalSchemaVersion="$OPERATIONAL_SCHEMA_VERSION" \
              storageAccountName="$REPORT_STORAGE_ACCOUNT_NAME" \
              reportStorageAccountUrl="$REPORT_STORAGE_ACCOUNT_URL" \
              reportStorageContainerName="$REPORT_STORAGE_CONTAINER" \
              claimScoringQueueName="$CLAIM_SCORING_QUEUE_NAME" \
              reportWorkerJobName="$REPORT_WORKER_JOB_NAME" \
              recoveryJobName="$REPORT_WORKER_RECOVERY_JOB_NAME" \
              recoveryScheduleCron="$REPORT_WORKER_RECOVERY_CRON" \
              modelServiceBaseUrl="$MODEL_SERVICE_BASE_URL" \
              modelServiceAudience="$MODEL_SERVICE_AUDIENCE" \
              modelDeploymentId="$MODEL_DEPLOYMENT_ID" \
              approvedModelDeploymentIds="$WORKER_APPROVED_MODEL_DEPLOYMENT_IDS" \
              prospectiveModelId="$MODEL_EXPECTED_ID" \
              prospectiveModelVersion="$MODEL_EXPECTED_VERSION" \
              prospectiveFeatureSchemaVersion="$MODEL_EXPECTED_FEATURE_SCHEMA" \
              prospectiveAnalysisMode="$MODEL_EXPECTED_ANALYSIS_MODE" \
              prospectiveThreshold="$MODEL_EXPECTED_BASELINE_THRESHOLD" \
              ensembleModelServiceBaseUrl="$ENSEMBLE_MODEL_SERVICE_BASE_URL" \
              ensembleModelServiceAudience="$MODEL_SERVICE_AUDIENCE" \
              ensembleDeploymentId="$ENSEMBLE_DEPLOYMENT_ID" \
              ensembleRuntimeConfigKey="$ENSEMBLE_RUNTIME_CONFIG_KEY" \
              ensembleModelId="$ENSEMBLE_EXPECTED_ID" \
              ensembleModelVersion="$ENSEMBLE_EXPECTED_VERSION" \
              ensembleFeatureSchemaVersion="$MODEL_EXPECTED_FEATURE_SCHEMA" \
              ensembleAnalysisMode="$MODEL_EXPECTED_ANALYSIS_MODE" \
              ensembleThreshold="$ENSEMBLE_EXPECTED_THRESHOLD" \
            --only-show-errors

      - name: Configure API claim-scoring wake-ups
        shell: bash
        run: |
          set -euo pipefail
          CLAIM_SCORING_QUEUE_URL="https://${REPORT_STORAGE_ACCOUNT_NAME}.queue.core.windows.net/${CLAIM_SCORING_QUEUE_NAME}"
          az webapp config appsettings set \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_API" \
            --settings \
              REPORT_STORAGE_BACKEND=azure_blob \
              REPORT_STORAGE_ACCOUNT_URL="$REPORT_STORAGE_ACCOUNT_URL" \
              REPORT_STORAGE_CONTAINER="$REPORT_STORAGE_CONTAINER" \
              EVIDENCE_STORAGE_BACKEND=azure_blob \
              EVIDENCE_STORAGE_ACCOUNT_URL="$REPORT_STORAGE_ACCOUNT_URL" \
              EVIDENCE_STORAGE_CONTAINER="$EVIDENCE_STORAGE_CONTAINER" \
              APPROVED_MODEL_DEPLOYMENT_IDS="$API_APPROVED_MODEL_DEPLOYMENT_IDS" \
              CLAIMGUARD_MANAGED_MODEL_DEPLOYMENT_ID="$API_MANAGED_MODEL_DEPLOYMENT_ID" \
              CLAIMGUARD_RELEASE_CANDIDATE_DEPLOYMENT_ID="$ENSEMBLE_DEPLOYMENT_ID" \
              CLAIMGUARD_RELEASE_CANDIDATE_ARTIFACT_SHA256="$RELEASE_ARTIFACT_SHA256" \
              CLAIMGUARD_RELEASE_CANDIDATE_IMAGE_DIGEST="$RELEASE_CANDIDATE_IMAGE_DIGEST" \
              CLAIMGUARD_RELEASE_IMAGE_DIGEST="$RELEASE_IMAGE_DIGEST" \
              CLAIM_SCORING_QUEUE_URL="$CLAIM_SCORING_QUEUE_URL" \
            >/dev/null
          az webapp restart --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_WEBAPP_API"

      - name: Verify API health after claim-scoring restart
        shell: bash
        env:
          API_HEALTH_DEADLINE_SECONDS: "300"
          API_HEALTH_REQUEST_TIMEOUT_SECONDS: "10"
          API_HEALTH_RETRY_SECONDS: "5"
        run: bash infra/verify-api-health.sh

      - name: Verify event-driven production configuration
        shell: bash
        run: |
          set -euo pipefail
          EVENT_JOB="$(az containerapp job show --resource-group "$AZURE_RESOURCE_GROUP" --name "$REPORT_WORKER_JOB_NAME" --output json)"
          RECOVERY_JOB="$(az containerapp job show --resource-group "$AZURE_RESOURCE_GROUP" --name "$REPORT_WORKER_RECOVERY_JOB_NAME" --output json)"
          EVENT_SCALE_RULE="$(echo "$EVENT_JOB" | jq -c '.properties.configuration.eventTriggerConfig.scale.rules[0]')"
          WORKER_ID="$(az identity show --resource-group "$AZURE_RESOURCE_GROUP" --name "$REPORT_WORKER_IDENTITY_NAME" --query id -o tsv)"
          EXPECTED_WORKER_ID="$(echo "$WORKER_ID" | tr '[:upper:]' '[:lower:]')"

          test "$(echo "$EVENT_JOB" | jq -r '.properties.configuration.triggerType')" = "Event"
          test "$(echo "$EVENT_JOB" | jq -r '.properties.configuration.eventTriggerConfig.scale.minExecutions')" = "0"
          test "$(echo "$EVENT_JOB" | jq -r '.properties.configuration.eventTriggerConfig.scale.maxExecutions')" = "100"
          test "$(echo "$EVENT_SCALE_RULE" | jq -r '.type')" = "azure-queue"
          test "$(echo "$EVENT_SCALE_RULE" | jq -r '.metadata.accountName')" = "$REPORT_STORAGE_ACCOUNT_NAME"
          test "$(echo "$EVENT_SCALE_RULE" | jq -r '.metadata.queueName')" = "$CLAIM_SCORING_QUEUE_NAME"
          test "$(echo "$EVENT_SCALE_RULE" | jq -r '.metadata.queueLength')" = "1"
          test "$(echo "$EVENT_SCALE_RULE" | jq -r '.identity | ascii_downcase')" = "$EXPECTED_WORKER_ID"
          test "$(echo "$EVENT_JOB" | jq -r '.properties.template.containers[0].args | join(" ")')" = "worker event"
          test "$(echo "$EVENT_JOB" | jq -r '.properties.template.containers[0].image')" = "$REPORT_WORKER_IMAGE"
          test "$(echo "$EVENT_JOB" | jq -r '.properties.template.containers[0].env[] | select(.name == "MODEL_SERVICE_DEPLOYMENT_ID") | .value')" = "$MODEL_DEPLOYMENT_ID"
          test "$(echo "$EVENT_JOB" | jq -r '.properties.template.containers[0].env[] | select(.name == "REPORT_WORKER_BATCH_SIZE") | .value')" = "1"
          test "$(echo "$EVENT_JOB" | jq -r '.properties.template.containers[0].env[] | select(.name == "REPORT_WORKER_SCHEME_CONCURRENCY") | .value')" = "5"
          test "$(echo "$EVENT_JOB" | jq -r '.properties.template.containers[0].env[] | select(.name == "MODEL_SERVICE_APPROVED_DEPLOYMENT_IDS") | .value')" = "$WORKER_APPROVED_MODEL_DEPLOYMENT_IDS"
          test "$(echo "$EVENT_JOB" | jq -r ".properties.template.containers[0].env[] | select(.name == \"MODEL_SERVICE_BASE_URL_${ENSEMBLE_RUNTIME_CONFIG_KEY}\") | .value")" = "$ENSEMBLE_MODEL_SERVICE_BASE_URL"
          test "$(echo "$RECOVERY_JOB" | jq -r '.properties.configuration.triggerType')" = "Schedule"
          test "$(echo "$RECOVERY_JOB" | jq -r '.properties.configuration.scheduleTriggerConfig.cronExpression')" = "$REPORT_WORKER_RECOVERY_CRON"
          test "$(echo "$RECOVERY_JOB" | jq -r '.properties.template.containers[0].args | join(" ")')" = "worker drain-all"
          test "$(echo "$RECOVERY_JOB" | jq -r '.properties.template.containers[0].image')" = "$REPORT_WORKER_IMAGE"
          test "$(echo "$RECOVERY_JOB" | jq -r '.properties.template.containers[0].env[] | select(.name == "MODEL_SERVICE_DEPLOYMENT_ID") | .value')" = "$MODEL_DEPLOYMENT_ID"
          test "$(echo "$RECOVERY_JOB" | jq -r '.properties.template.containers[0].env[] | select(.name == "MODEL_SERVICE_APPROVED_DEPLOYMENT_IDS") | .value')" = "$WORKER_APPROVED_MODEL_DEPLOYMENT_IDS"
          EVENT_EXECUTION_COUNT_AFTER="$(az containerapp job execution list \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$REPORT_WORKER_JOB_NAME" \
            --query 'length(@)' -o tsv)"
          test "$(az containerapp job execution list \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$REPORT_WORKER_RECOVERY_JOB_NAME" \
            --query 'length(@)' -o tsv)" = "$RECOVERY_EXECUTION_COUNT_BEFORE"
          EVENT_ACTIVE_AFTER="$(az containerapp job execution list \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$REPORT_WORKER_JOB_NAME" \
            --query "length([?properties.status=='Running' || properties.status=='Processing'])" -o tsv)"
          test "$(az containerapp job execution list \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$REPORT_WORKER_RECOVERY_JOB_NAME" \
            --query "length([?properties.status=='Running' || properties.status=='Processing'])" -o tsv)" = "0"
          QUEUE_PEEK_COUNT_AFTER="$(az storage message peek \
            --account-name "$REPORT_STORAGE_ACCOUNT_NAME" \
            --queue-name "$CLAIM_SCORING_QUEUE_NAME" \
            --num-messages 32 \
            --auth-mode key \
            --query 'length(@)' -o tsv)"

          SETTINGS="$(az webapp config appsettings list \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_API" \
            --query "[?name=='REPORT_STORAGE_BACKEND' || name=='REPORT_STORAGE_ACCOUNT_URL' || name=='REPORT_STORAGE_CONTAINER' || name=='EVIDENCE_STORAGE_BACKEND' || name=='EVIDENCE_STORAGE_ACCOUNT_URL' || name=='EVIDENCE_STORAGE_CONTAINER' || name=='APPROVED_MODEL_DEPLOYMENT_IDS' || name=='CLAIMGUARD_MANAGED_MODEL_DEPLOYMENT_ID' || name=='CLAIM_SCORING_QUEUE_URL'].{name:name,value:value}" \
            --output json)"
          test "$(echo "$SETTINGS" | jq length)" -eq 9
          test "$(echo "$SETTINGS" | jq -r '.[] | select(.name == "CLAIM_SCORING_QUEUE_URL") | .value')" = "https://${REPORT_STORAGE_ACCOUNT_NAME}.queue.core.windows.net/${CLAIM_SCORING_QUEUE_NAME}"
          test "$(echo "$SETTINGS" | jq -r '.[] | select(.name == "APPROVED_MODEL_DEPLOYMENT_IDS") | .value')" = "$API_APPROVED_MODEL_DEPLOYMENT_IDS"
          test "$(echo "$SETTINGS" | jq -r '.[] | select(.name == "CLAIMGUARD_MANAGED_MODEL_DEPLOYMENT_ID") | .value')" = "$API_MANAGED_MODEL_DEPLOYMENT_ID"
          test "$(echo "$SETTINGS" | jq -r '.[] | select(.name == "EVIDENCE_STORAGE_BACKEND") | .value')" = "azure_blob"
          test "$(echo "$SETTINGS" | jq -r '.[] | select(.name == "EVIDENCE_STORAGE_CONTAINER") | .value')" = "$EVIDENCE_STORAGE_CONTAINER"

          {
            echo "### Report-worker deployment audit"
            echo "- Event executions: ${EVENT_EXECUTION_COUNT_BEFORE} before, ${EVENT_EXECUTION_COUNT_AFTER} after"
            echo "- Active event executions: ${EVENT_ACTIVE_BEFORE} before, ${EVENT_ACTIVE_AFTER} after"
            echo "- Recovery executions: ${RECOVERY_EXECUTION_COUNT_BEFORE} before and after"
            echo "- Queue peek (maximum 32): ${QUEUE_PEEK_COUNT_BEFORE} before, ${QUEUE_PEEK_COUNT_AFTER} after"
            echo "- Recovery cron: ${REPORT_WORKER_RECOVERY_CRON}"
            echo "- Worker-approved deployments: ${WORKER_APPROVED_MODEL_DEPLOYMENT_IDS}"
            echo "- API-managed deployment: ${API_MANAGED_MODEL_DEPLOYMENT_ID}"
          } >> "$GITHUB_STEP_SUMMARY"
