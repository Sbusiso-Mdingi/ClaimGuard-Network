name: JavaScript diagnostics

on:
  pull_request:
    paths:
      - "packages/**"
      - "apps/**"
      - ".github/workflows/javascript-diagnostics.yml"

permissions:
  contents: read

jobs:
  javascript-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run JavaScript tests verbosely
        shell: bash
        run: |
          set -o pipefail
          mkdir -p test-results
          pnpm test 2>&1 | tee test-results/javascript-tests.log
      - name: Upload JavaScript test log
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: javascript-test-log
          path: test-results/javascript-tests.log
          if-no-files-found: error
          retention-days: 7
